<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zadania</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="pasek">
      <h1>Zadania</h1>
      <nav class="nawigacja">
        <a href="/dziennik.html">Dziennik →</a>
        <a href="/statystyki.html">Statystyki →</a>
        <a href="/projekty.html">Projekty →</a>
        <a href="/postac.html">Postać →</a>
      </nav>
      <button id="przycisk-dodaj" type="button">+ Dodaj zadanie</button>
      <button id="przycisk-eksport" type="button">Eksportuj do CSV</button>
      <!--
        Wybor profilu importu. Wartosci odpowiadaja kluczom rejestru PROFILE
        w routes/import.js - endpoint /api/import/:profil przyjmuje je wprost,
        wiec dodanie profilu to jedna opcja tutaj plus wpis w routes.

        Strona dziennika NIE ma tego wyboru: ma jeden profil, podany przez
        data-profil na przycisku. Oba sposoby obsluguje public/js/csv-import.js.
      -->
      <label class="wybor-profilu">
        Źródło:
        <select id="profil-importu" title="Skąd pochodzi plik, który chcesz wczytać">
          <option
            value="zadania"
            title="Plik z przycisku „Eksportuj do CSV” na tej stronie. Nagłówki: Nazwa zadania, Stan, Obszar, Termin…"
          >
            Zadania — eksport z tej aplikacji
          </option>
          <option
            value="notion-quest-log"
            title="Eksport bazy „Success Plan” z Notion. Wczytuje projekty i zadania z jednego pliku i wiąże je po kolumnie Upstream."
          >
            Notion Success Plan — projekty + zadania
          </option>
        </select>
      </label>
      <button id="przycisk-import" type="button" data-profil="zadania">Importuj z CSV</button>
      <!--
        Ukryty input pliku: przycisk wyzej wywoluje go programowo, zeby oba
        przyciski wygladaly tak samo. accept to tylko podpowiedz dla okna wyboru
        - o tym, czy plik da sie wczytac, decyduje parser po stronie serwera.
      -->
      <input type="file" id="plik-importu" accept=".csv,text/csv" hidden />
      <!-- Krotki komunikat o wyniku ostatniej operacji (zapisano / blad). -->
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <!--
      Panel filtrow. <details> daje zwijanie bez ani jednej linijki JS.
      Listy checkboxow (stany, priorytety, obszary, projekty) buduje public/js/zadania.js
      ze slownikow z /api/slowniki - nie ma ich tu na sztywno, zeby dopisanie
      obszaru w config/slowniki.js od razu pojawialo sie w filtrach.
    -->
    <details id="panel-filtrow" class="filtry">
      <summary>
        Filtry<span id="znacznik-filtrow" class="znacznik"></span>
      </summary>

      <div class="filtry-tresc">
        <label class="filtr">
          <span class="filtr-tytul">Nazwa zawiera</span>
          <input type="search" id="filtr-nazwa" placeholder="np. raport" />
        </label>

        <fieldset class="filtr">
          <legend>Stan</legend>
          <div id="filtr-stany" class="checkboxy"></div>
        </fieldset>

        <fieldset class="filtr">
          <legend>Priorytet</legend>
          <div id="filtr-priorytety" class="checkboxy"></div>
        </fieldset>

        <!--
          Obszar i Projekt maja przelacznik trybu: "uwzglednij" zostawia tylko
          zaznaczone, "wyklucz" zostawia wszystko oprocz zaznaczonych.
          Tryb jest JEDEN dla calej listy, wiec wartosc nie moze byc jednoczesnie
          zaznaczona i wykluczona - nie ma konfliktu do rozstrzygania.

          Pusta lista znaczy "brak filtra" w obu trybach.
        -->
        <fieldset class="filtr filtr-szeroki">
          <legend>Obszar</legend>
          <div class="tryb-filtra" id="tryb-obszary">
            <label><input type="radio" name="tryb-obszary" value="uwzglednij" checked /> uwzględnij</label>
            <label><input type="radio" name="tryb-obszary" value="wyklucz" /> wyklucz</label>
          </div>
          <div id="filtr-obszary" class="checkboxy"></div>
        </fieldset>

        <fieldset class="filtr filtr-szeroki">
          <legend>Projekt</legend>
          <div class="tryb-filtra" id="tryb-projekty">
            <label><input type="radio" name="tryb-projekty" value="uwzglednij" checked /> uwzględnij</label>
            <label><input type="radio" name="tryb-projekty" value="wyklucz" /> wyklucz</label>
          </div>
          <div id="filtr-projekty" class="checkboxy"></div>
        </fieldset>

        <!--
          Gorna granica terminu - to ona realizuje domyslny widok "najblizszy tydzien".
          Osobne pole, a nie czesc "Zakresu dat" nizej, bo dziala inaczej:
          nie ma dolnej granicy (przeterminowane zostaja widoczne) i przepuszcza
          zadania BEZ terminu. Patrz pasujeTerminDo w public/js/reguly-zadan.js.
        -->
        <fieldset class="filtr">
          <legend>Termin najpóźniej</legend>
          <label class="zakres">
            do <input type="date" id="filtr-termin-do" />
          </label>
          <p class="filtr-podpowiedz">
            Zadania po terminie i bez terminu zostają widoczne.
          </p>
        </fieldset>

        <!--
          Zakres dat celowo na polach type="date", a nie datetime-local:
          dopasowanie liczy sie na pelnych dniach kalendarzowych, wiec godzina
          nie mialaby tu zadnego wplywu (patrz pasujeZakresDat w zadania.js).
          Presety to skroty, ktore po prostu wypelniaja pola OD i DO - dzieki temu
          zawsze widac, jaki zakres jest naprawde uzyty, i mozna go recznie poprawic.
        -->
        <fieldset class="filtr filtr-szeroki">
          <legend>Zakres dat</legend>
          <div id="presety-dat" class="presety"></div>
          <label class="zakres">od <input type="date" id="filtr-od" /></label>
          <label class="zakres">do <input type="date" id="filtr-do" /></label>
        </fieldset>

        <button type="button" id="przycisk-wyczysc">Wyczyść filtry</button>
      </div>
    </details>

    <!--
      Naglowki tabeli sa statyczne, bo kolumny sa staly element interfejsu.
      Wiersze buduje public/js/zadania.js na podstawie danych z /api/zadania.
      Kolumny oznaczone jako "wyliczane" nie istnieja w bazie - licza sie w przegladarce.

      data-kolumna = klucz sortowania (patrz KOLUMNY_SORTOWANIA w public/js/zadania.js).
      Naglowek bez tego atrybutu jest po prostu nieklikalny.
    -->
    <!--
      Podglad importu (dry-run). Ukryty, dopoki nie wybierzesz pliku.
      Zapis do bazy nastepuje dopiero po klknieciu "Zatwierdź import" - to celowo
      osobny krok, zeby dalo sie najpierw zobaczyc, co wejdzie, a co odpadnie.
    -->
    <section id="panel-importu" class="import" hidden>
      <h2 id="import-naglowek"></h2>
      <p id="import-uwagi" class="import-uwagi"></p>
      <div id="import-odrzucone"></div>
      <div class="import-akcje">
        <button type="button" id="przycisk-zatwierdz-import">Zatwierdź import</button>
        <button type="button" id="przycisk-anuluj-import">Anuluj</button>
      </div>
    </section>

    <!--
      Informacja o domyslnym ograniczeniu widoku. Ukryta, gdy nic nie jest ukryte.
      Istnieje po to, zeby brak zrobionych zadan nie wygladal jak utrata danych -
      mowi wprost, ile wierszy jest schowanych, i daje jeden przycisk na pokazanie
      wszystkiego. Samo ograniczenie robi zwykly filtr stanu, widoczny w panelu wyzej.
    -->
    <p id="ograniczenie-widoku" class="ograniczenie" hidden>
      <span id="ograniczenie-tekst"></span>
      <button type="button" id="przycisk-pokaz-wszystkie"></button>
    </p>

    <table id="tabela-zadan">
      <thead id="naglowki" title="Kliknij nagłówek, aby posortować">
        <tr>
          <th class="kol-id" data-kolumna="id">#</th>
          <th class="kol-stan" data-kolumna="stan">Stan</th>
          <th class="kol-nazwa" data-kolumna="nazwa">Nazwa</th>
          <th class="kol-priorytet" data-kolumna="priorytet">Priorytet</th>
          <!-- Trudnosc jest NIEZALEZNA od priorytetu: priorytet = pilnosc (zarzadzanie),
               trudnosc = waga zadania przy naliczaniu XP. -->
          <th class="kol-trudnosc" data-kolumna="trudnosc" title="Waga zadania przy naliczaniu XP">
            Trudność
          </th>
          <th
            class="kol-godziny"
            data-kolumna="czas_trwania_godziny"
            title="Ile godzin faktycznie zajęło — wpisywane ręcznie, liczy się do XP"
          >
            Czas (h)
          </th>
          <th class="kol-obszar" data-kolumna="obszar">Obszar</th>
          <th class="kol-projekt" data-kolumna="projekt_id" title="Projekt nadrzędny — kontener, nie daje XP">Projekt</th>
          <th class="kol-data" data-kolumna="start_zadania">Start</th>
          <th class="kol-data" data-kolumna="termin">Termin</th>
          <th class="kol-liczba" data-kolumna="dni_do_terminu" title="Wyliczane: termin minus dzisiaj">
            Dni do terminu
          </th>
          <th class="kol-data" data-kolumna="czas_zakonczenia">Zakończenie</th>
          <th class="kol-akcje"></th>
        </tr>
      </thead>
      <tbody id="wiersze"></tbody>
    </table>

    <p id="podsumowanie" class="podsumowanie"></p>

    <script src="/js/api.js"></script>
    <script src="/js/csv.js"></script>
    <script src="/js/filtr-dat.js"></script>
    <script src="/js/reguly-zadan.js"></script>
    <script src="/js/csv-import.js"></script>
    <script src="/js/zadania.js"></script>
  </body>
</html>
