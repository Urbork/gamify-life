<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tasks</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Motyw ustawiany SYNCHRONICZNIE, przed pierwszym malowaniem - inaczej przy
      wyborze ciemnym mignelaby jasna strona. Stad zwykly <script> w <head>,
      bez defer i bez async.
    -->
    <script src="/js/motyw.js"></script>
  </head>
  <body>
    <header class="pasek">
      <h1>Tasks</h1>
      <!--
        Menu jest IDENTYCZNE na wszystkich stronach - ta sama kolejnosc, ten sam
        komplet pozycji. Wczesniej kazda strona miala wlasny podzbior (na "Postaci"
        brakowalo "Projektow"), wiec z menu nie dalo sie odczytac, co w ogole istnieje.

        Biezaca strone znaczy aria-current="page" - to jedyna roznica miedzy plikami.
        Atrybut niesie informacje takze dla czytnikow ekranu, a CSS wyroznia go wizualnie.

        Strzalki celowo usuniete: sugerowaly kolejnosc ("Dziennik -&gt;", "&lt;- Zadania"),
        ktorej miedzy tymi stronami nie ma.
      -->
      <nav class="nawigacja" aria-label="App sections">
        <a href="/index.html" aria-current="page">📋 Tasks</a>
        <a href="/dziennik.html">📓 Journal</a>
        <a href="/statystyki.html">📊 Stats</a>
        <a href="/projekty.html">📁 Projects</a>
        <a href="/postac.html">🎮 Character</a>
      </nav>
      <!-- Przelacznik motywu: system -> jasny -> ciemny. Tresc i tytul ustawia motyw.js. -->
      <button id="przelacznik-motywu" class="przelacznik-motywu" type="button"></button>
      <button id="przycisk-dodaj" type="button">+ Add task</button>
      <button id="przycisk-eksport" type="button">Export to CSV</button>
      <!--
        Wybor profilu importu. Wartosci odpowiadaja kluczom rejestru PROFILE
        w routes/import.js - endpoint /api/import/:profil przyjmuje je wprost,
        wiec dodanie profilu to jedna opcja tutaj plus wpis w routes.

        Strona dziennika NIE ma tego wyboru: ma jeden profil, podany przez
        data-profil na przycisku. Oba sposoby obsluguje public/js/csv-import.js.
      -->
      <label class="wybor-profilu">
        Source:
        <select id="profil-importu" title="Where the file you want to load comes from">
          <option
            value="zadania"
            title="A file from the „Export to CSV” button on this page. Headers: Nazwa zadania, Stan, Obszar, Termin…"
          >
            Tasks — export from this app
          </option>
          <option
            value="notion-quest-log"
            title="Notion „Success Plan” export. Loads projects and tasks from one file and links them by the Upstream column."
          >
            Notion Success Plan — projects + tasks
          </option>
        </select>
      </label>
      <button id="przycisk-import" type="button" data-profil="zadania">Import from CSV</button>
      <!--
        Ukryty input pliku: przycisk wyzej wywoluje go programowo, zeby oba
        przyciski wygladaly tak samo. accept to tylko podpowiedz dla okna wyboru
        - o tym, czy plik da sie wczytac, decyduje parser po stronie serwera.
      -->
      <input type="file" id="plik-importu" accept=".csv,text/csv" hidden />
      <!-- Krotki komunikat o wyniku ostatniej operacji (zapisano / blad). -->
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <!--
      Panel filtrow. <details> daje zwijanie bez ani jednej linijki JS.
      Listy checkboxow (stany, priorytety, obszary, projekty) buduje public/js/zadania.js
      ze slownikow z /api/slowniki - nie ma ich tu na sztywno, zeby dopisanie
      obszaru w config/slowniki.js od razu pojawialo sie w filtrach.
    -->
    <details id="panel-filtrow" class="filtry">
      <summary>
        Filters<span id="znacznik-filtrow" class="znacznik"></span>
      </summary>

      <div class="filtry-tresc">
        <label class="filtr">
          <span class="filtr-tytul">Name contains</span>
          <input type="search" id="filtr-nazwa" placeholder="e.g. report" />
        </label>

        <fieldset class="filtr">
          <legend>Status</legend>
          <div id="filtr-stany" class="checkboxy"></div>
        </fieldset>

        <fieldset class="filtr">
          <legend>Priority</legend>
          <div id="filtr-priorytety" class="checkboxy"></div>
        </fieldset>

        <!--
          Obszar i Projekt maja przelacznik trybu: "uwzglednij" zostawia tylko
          zaznaczone, "wyklucz" zostawia wszystko oprocz zaznaczonych.
          Tryb jest JEDEN dla calej listy, wiec wartosc nie moze byc jednoczesnie
          zaznaczona i wykluczona - nie ma konfliktu do rozstrzygania.
          Pusta lista znaczy "brak filtra" w obu trybach.

          Oba pola sa ZWINIETE, bo 12 obszarow i 32 projekty rozpychaly panel.
          To wylacznie opakowanie - checkboxy i cala logika filtrowania
          zostaja bez zmian, a <summary> pokazuje stan, zeby zwiniete pole
          nie ukrywalo aktywnego filtra.

          Stanu i Priorytetu celowo NIE zwijamy: maja po 5 pozycji, mieszcza sie
          w jednej linii, a filtr stanu jest czescia widoku domyslnego - schowanie
          go za klknieciem dzialaloby przeciwko banerowi, ktory ma tlumaczyc,
          dlaczego wierszy jest mniej.
        -->
        <details class="filtr filtr-szeroki filtr-zwijany" id="pole-obszary">
          <summary id="podsumowanie-obszary">Area — all</summary>
          <div class="tryb-filtra" id="tryb-obszary">
            <label><input type="radio" name="tryb-obszary" value="uwzglednij" checked /> include</label>
            <label><input type="radio" name="tryb-obszary" value="wyklucz" /> exclude</label>
          </div>
          <div id="filtr-obszary" class="checkboxy"></div>
        </details>

        <details class="filtr filtr-szeroki filtr-zwijany" id="pole-projekty">
          <summary id="podsumowanie-projekty">Project — all</summary>
          <div class="tryb-filtra" id="tryb-projekty">
            <label><input type="radio" name="tryb-projekty" value="uwzglednij" checked /> include</label>
            <label><input type="radio" name="tryb-projekty" value="wyklucz" /> exclude</label>
          </div>
          <div id="filtr-projekty" class="checkboxy"></div>
        </details>

        <!--
          Gorna granica terminu - to ona realizuje domyslny widok "najblizszy tydzien".
          Osobne pole, a nie czesc "Zakresu dat" nizej, bo dziala inaczej:
          nie ma dolnej granicy (przeterminowane zostaja widoczne) i przepuszcza
          zadania BEZ terminu. Patrz pasujeTerminDo w public/js/reguly-zadan.js.
        -->
        <fieldset class="filtr">
          <legend>Due no later than</legend>
          <label class="zakres">
            to <input type="date" id="filtr-termin-do" />
          </label>
          <p class="filtr-podpowiedz">
            Overdue tasks and tasks without a due date stay visible.
          </p>
        </fieldset>

        <!--
          Zakres dat celowo na polach type="date", a nie datetime-local:
          dopasowanie liczy sie na pelnych dniach kalendarzowych, wiec godzina
          nie mialaby tu zadnego wplywu (patrz pasujeZakresDat w zadania.js).
          Presety to skroty, ktore po prostu wypelniaja pola OD i DO - dzieki temu
          zawsze widac, jaki zakres jest naprawde uzyty, i mozna go recznie poprawic.
        -->
        <fieldset class="filtr filtr-szeroki">
          <legend>Date range</legend>
          <div id="presety-dat" class="presety"></div>
          <label class="zakres">from <input type="date" id="filtr-od" /></label>
          <label class="zakres">to <input type="date" id="filtr-do" /></label>
        </fieldset>

        <button type="button" id="przycisk-wyczysc">Clear filters</button>
      </div>
    </details>

    <!--
      Naglowki tabeli sa statyczne, bo kolumny sa staly element interfejsu.
      Wiersze buduje public/js/zadania.js na podstawie danych z /api/zadania.
      Kolumny oznaczone jako "wyliczane" nie istnieja w bazie - licza sie w przegladarce.

      data-kolumna = klucz sortowania (patrz KOLUMNY_SORTOWANIA w public/js/zadania.js).
      Naglowek bez tego atrybutu jest po prostu nieklikalny.
    -->
    <!--
      Podglad importu (dry-run). Ukryty, dopoki nie wybierzesz pliku.
      Zapis do bazy nastepuje dopiero po klknieciu "Zatwierdź import" - to celowo
      osobny krok, zeby dalo sie najpierw zobaczyc, co wejdzie, a co odpadnie.
    -->
    <section id="panel-importu" class="import" hidden>
      <h2 id="import-naglowek"></h2>
      <p id="import-uwagi" class="import-uwagi"></p>
      <div id="import-odrzucone"></div>
      <div class="import-akcje">
        <button type="button" id="przycisk-zatwierdz-import">Confirm import</button>
        <button type="button" id="przycisk-anuluj-import">Cancel</button>
      </div>
    </section>

    <table id="tabela-zadan">
      <thead id="naglowki" title="Click a header to sort">
        <tr>
          <th class="kol-id" data-kolumna="id">#</th>
          <th class="kol-stan" data-kolumna="stan">Status</th>
          <th class="kol-nazwa" data-kolumna="nazwa">Name</th>
          <th class="kol-priorytet" data-kolumna="priorytet">Priority</th>
          <!-- Trudnosc jest NIEZALEZNA od priorytetu: priorytet = pilnosc (zarzadzanie),
               trudnosc = waga zadania przy naliczaniu XP. -->
          <th class="kol-trudnosc" data-kolumna="trudnosc" title="Task weight when XP is calculated">
            Difficulty
          </th>
          <th
            class="kol-godziny"
            data-kolumna="czas_trwania_godziny"
            title="How many hours it actually took — entered by hand, counts towards XP"
          >
            Time (h)
          </th>
          <th class="kol-obszar" data-kolumna="obszar">Area</th>
          <th class="kol-projekt" data-kolumna="projekt_id" title="Parent project — a container, gives no XP">Project</th>
          <th class="kol-data" data-kolumna="start_zadania">Start</th>
          <th class="kol-data" data-kolumna="termin">Due</th>
          <th class="kol-liczba" data-kolumna="dni_do_terminu" title="Computed: due date minus today">
            Days to due
          </th>
          <th class="kol-data" data-kolumna="czas_zakonczenia">Completed</th>
          <!--
            XP liczy SERWER (lib/nagrody.js) i przysyła gotowe z /api/zadania -
            przegladarka niczego tu nie przelicza, zeby silnik nie mial dwoch
            implementacji. Kolumna jest tylko do odczytu, wiec nie ma data-kolumna
            do sortowania po stronie bazy - sortowanie obsluguje reguly-zadan.js.
          -->
          <th class="kol-liczba" data-kolumna="xp" title="How much XP this task gives: hours × difficulty multiplier, times the timeliness multiplier">
            XP
          </th>
          <th class="kol-akcje"></th>
        </tr>
      </thead>
      <tbody id="wiersze"></tbody>
    </table>

    <!--
      Doladowanie listy. Tabela rysuje tylko pierwsze N wierszy tego, co przeszlo
      przez filtry - reszta czeka tutaj. To ograniczenie RYSOWANIA, nie filtr:
      eksport, kopia zapasowa i XP zawsze widza pelny zbior.
    -->
    <p id="doladowanie" class="doladowanie" hidden>
      <button type="button" id="przycisk-doladuj"></button>
    </p>

    <p id="podsumowanie" class="podsumowanie"></p>

    <script src="/js/api.js"></script>
    <script src="/js/csv.js"></script>
    <script src="/js/filtr-dat.js"></script>
    <script src="/js/reguly-zadan.js"></script>
    <script src="/js/csv-import.js"></script>
    <script src="/js/zadania.js"></script>
  </body>
</html>
