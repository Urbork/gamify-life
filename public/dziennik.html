<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Journal</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Motyw ustawiany SYNCHRONICZNIE, przed pierwszym malowaniem - inaczej przy
      wyborze ciemnym mignelaby jasna strona. Stad zwykly <script> w <head>,
      bez defer i bez async.
    -->
    <script src="/js/motyw.js"></script>
  </head>
  <body>
    <header class="pasek">
      <h1>Journal</h1>
      <!--
        Menu jest IDENTYCZNE na wszystkich stronach - ta sama kolejnosc, ten sam
        komplet pozycji. Wczesniej kazda strona miala wlasny podzbior (na "Postaci"
        brakowalo "Projektow"), wiec z menu nie dalo sie odczytac, co w ogole istnieje.

        Biezaca strone znaczy aria-current="page" - to jedyna roznica miedzy plikami.
        Atrybut niesie informacje takze dla czytnikow ekranu, a CSS wyroznia go wizualnie.

        Strzalki celowo usuniete: sugerowaly kolejnosc ("Dziennik -&gt;", "&lt;- Zadania"),
        ktorej miedzy tymi stronami nie ma.
      -->
      <nav class="nawigacja" aria-label="App sections">
        <a href="/index.html">📋 Tasks</a>
        <a href="/dziennik.html" aria-current="page">📓 Journal</a>
        <a href="/statystyki.html">📊 Stats</a>
        <a href="/projekty.html">📁 Projects</a>
        <a href="/postac.html">🎮 Character</a>
      </nav>
      <!-- Przelacznik motywu: system -> jasny -> ciemny. Tresc i tytul ustawia motyw.js. -->
      <button id="przelacznik-motywu" class="przelacznik-motywu" type="button"></button>
      <button id="przycisk-dodaj" type="button">+ Add entry</button>
      <button id="przycisk-eksport" type="button">Export to CSV</button>
      <button id="przycisk-import" type="button" data-profil="dziennik">Import from CSV</button>
      <input type="file" id="plik-importu" accept=".csv,text/csv" hidden />
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <!--
      Panel filtrow - ten sam uklad i te same klasy CSS co na stronie zadan.
      Liste nawykow buduje public/js/dziennik.js ze slownika z /api/slowniki,
      zeby dopisanie nawyku w config/slowniki.js od razu pojawialo sie w filtrach.
    -->
    <details id="panel-filtrow" class="filtry">
      <summary>
        Filters<span id="znacznik-filtrow" class="znacznik"></span>
      </summary>

      <div class="filtry-tresc">
        <label class="filtr">
          <span class="filtr-tytul">Search in text</span>
          <input type="search" id="filtr-szukaj" placeholder="e.g. Karolina" />
        </label>

        <!-- Dziennik ma tylko jedno pole daty, wiec zakres jest prostszy
             niz w zadaniach (tam sprawdzamy termin ORAZ okres aktywnosci). -->
        <fieldset class="filtr filtr-szeroki">
          <legend>Date range</legend>
          <div id="presety-dat" class="presety"></div>
          <label class="zakres">from <input type="date" id="filtr-od" /></label>
          <label class="zakres">to <input type="date" id="filtr-do" /></label>
        </fieldset>

        <fieldset class="filtr filtr-szeroki">
          <legend>Habit</legend>
          <div id="filtr-nawyki" class="checkboxy"></div>
        </fieldset>

        <!--
          Slowa opisujace dzien. Zwiniete, bo slownik ma 36 pozycji i rozpychal
          panel - ta sama decyzja co przy Obszarze i Projekcie na stronie zadan.
        -->
        <details class="filtr filtr-szeroki filtr-zwijany" id="pole-slowa">
          <summary id="podsumowanie-slowa">Words — all</summary>
          <div id="filtr-slowa" class="checkboxy"></div>
        </details>

        <button type="button" id="przycisk-wyczysc">Clear filters</button>
      </div>
    </details>

    <!-- Podglad importu (dry-run) - ten sam mechanizm co na stronie zadan,
         rozni je tylko data-profil na przycisku wyzej. -->
    <section id="panel-importu" class="import" hidden>
      <h2 id="import-naglowek"></h2>
      <p id="import-uwagi" class="import-uwagi"></p>
      <div id="import-odrzucone"></div>
      <div class="import-akcje">
        <button type="button" id="przycisk-zatwierdz-import">Confirm import</button>
        <button type="button" id="przycisk-anuluj-import">Cancel</button>
      </div>
    </section>

    <!--
      Naglowki statyczne, wiersze buduje public/js/dziennik.js.
      data-kolumna = klucz sortowania; naglowek bez tego atrybutu jest nieklikalny.
      Domyslne sortowanie: data malejaco (najnowszy wpis u gory).
    -->
    <table id="tabela-dziennika">
      <thead id="naglowki" title="Click a header to sort">
        <tr>
          <th class="kol-id" data-kolumna="id">#</th>
          <th class="kol-dzien" data-kolumna="data">Date</th>
          <th class="kol-godzina" data-kolumna="pobudka">Wake-up</th>
          <th class="kol-ocena" data-kolumna="godziny_snu">Sleep (h)</th>
          <th class="kol-ocena" data-kolumna="jakosc_snu">Sleep quality</th>
          <th class="kol-ocena" data-kolumna="stres">Calm</th>
          <th class="kol-ocena" data-kolumna="nastroj">Mood</th>
          <th class="kol-ocena" data-kolumna="intencjonalnosc">Intentionality</th>
          <th class="kol-tekst" data-kolumna="trzy_slowa">Three words</th>
          <th class="kol-tekst-szeroki" data-kolumna="nawyki">Habits</th>
          <th class="kol-tekst" data-kolumna="wdziecznosc">Gratitude</th>
          <th class="kol-tekst" data-kolumna="bledy">Mistakes</th>
          <th class="kol-tekst" data-kolumna="rozmowa">Conversation</th>
          <th class="kol-tekst" data-kolumna="co_poszlo_dobrze">What went well</th>
          <th class="kol-tekst" data-kolumna="jutro_wazne">Important tomorrow</th>
          <th class="kol-tekst" data-kolumna="do_przemyslenia">To think about</th>
          <!-- Licznik wypelnionych pol refleksyjnych. Tylko do odczytu - informacyjny,
               pokazuje ile z szesciu pol dzien ma opisanych. -->
          <th class="kol-refleksje" title="How many of the six reflective fields are filled">Reflections</th>
          <th class="kol-tekst" data-kolumna="sniadanie">Breakfast</th>
          <th class="kol-tekst" data-kolumna="obiad">Lunch</th>
          <th class="kol-tekst" data-kolumna="kolacja">Dinner</th>
          <th class="kol-akcje"></th>
        </tr>
      </thead>
      <tbody id="wiersze"></tbody>
    </table>

    <!--
      Doladowanie listy. Tabela rysuje tylko pierwsze N wierszy tego, co przeszlo
      przez filtry - reszta czeka tutaj. To ograniczenie RYSOWANIA, nie filtr:
      eksport, kopia zapasowa i XP zawsze widza pelny zbior.
    -->
    <p id="doladowanie" class="doladowanie" hidden>
      <button type="button" id="przycisk-doladuj"></button>
    </p>

    <p id="podsumowanie" class="podsumowanie"></p>

    <!--
      Panel wyboru wielokrotnego. JEDEN na cala strone, obsluguje OBA pola tego
      rodzaju - Nawyki i Słowa - bo roznia sie wylacznie slownikiem i podpisami.
      Ktore pole jest edytowane, mowi data-pole klikanej komorki.

      Trzymany poza tabela, zeby nie rozpychal wiersza i nie byl przycinany
      przez poziome przewijanie tabeli.
    -->
    <div id="panel-wyboru" class="panel-wyboru" hidden>
      <div class="panel-naglowek">
        <strong id="tytul-wyboru"></strong>
        <button type="button" id="zamknij-wybor" class="usun" title="Close">×</button>
      </div>
      <div id="lista-wyboru" class="lista-wyboru"></div>
      <div class="panel-stopka">
        <input type="text" id="nowa-wartosc" />
        <button type="button" id="dodaj-wartosc"></button>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/csv.js"></script>
    <script src="/js/filtr-dat.js"></script>
    <script src="/js/reguly-statystyk.js"></script>
    <script src="/js/reguly-dziennika.js"></script>
    <script src="/js/csv-import.js"></script>
    <script src="/js/dziennik.js"></script>
  </body>
</html>
