<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dziennik</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Motyw ustawiany SYNCHRONICZNIE, przed pierwszym malowaniem - inaczej przy
      wyborze ciemnym mignelaby jasna strona. Stad zwykly <script> w <head>,
      bez defer i bez async.
    -->
    <script src="/js/motyw.js"></script>
  </head>
  <body>
    <header class="pasek">
      <h1>Dziennik</h1>
      <!--
        Menu jest IDENTYCZNE na wszystkich stronach - ta sama kolejnosc, ten sam
        komplet pozycji. Wczesniej kazda strona miala wlasny podzbior (na "Postaci"
        brakowalo "Projektow"), wiec z menu nie dalo sie odczytac, co w ogole istnieje.

        Biezaca strone znaczy aria-current="page" - to jedyna roznica miedzy plikami.
        Atrybut niesie informacje takze dla czytnikow ekranu, a CSS wyroznia go wizualnie.

        Strzalki celowo usuniete: sugerowaly kolejnosc ("Dziennik -&gt;", "&lt;- Zadania"),
        ktorej miedzy tymi stronami nie ma.
      -->
      <nav class="nawigacja" aria-label="Sekcje aplikacji">
        <a href="/index.html">📋 Zadania</a>
        <a href="/dziennik.html" aria-current="page">📓 Dziennik</a>
        <a href="/statystyki.html">📊 Statystyki</a>
        <a href="/projekty.html">📁 Projekty</a>
        <a href="/postac.html">🎮 Postać</a>
      </nav>
      <!-- Przelacznik motywu: system -> jasny -> ciemny. Tresc i tytul ustawia motyw.js. -->
      <button id="przelacznik-motywu" class="przelacznik-motywu" type="button"></button>
      <button id="przycisk-dodaj" type="button">+ Dodaj wpis</button>
      <button id="przycisk-eksport" type="button">Eksportuj do CSV</button>
      <button id="przycisk-import" type="button" data-profil="dziennik">Importuj z CSV</button>
      <input type="file" id="plik-importu" accept=".csv,text/csv" hidden />
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <!--
      Panel filtrow - ten sam uklad i te same klasy CSS co na stronie zadan.
      Liste nawykow buduje public/js/dziennik.js ze slownika z /api/slowniki,
      zeby dopisanie nawyku w config/slowniki.js od razu pojawialo sie w filtrach.
    -->
    <details id="panel-filtrow" class="filtry">
      <summary>
        Filtry<span id="znacznik-filtrow" class="znacznik"></span>
      </summary>

      <div class="filtry-tresc">
        <label class="filtr">
          <span class="filtr-tytul">Szukaj w tekście</span>
          <input type="search" id="filtr-szukaj" placeholder="np. Karolina" />
        </label>

        <!-- Dziennik ma tylko jedno pole daty, wiec zakres jest prostszy
             niz w zadaniach (tam sprawdzamy termin ORAZ okres aktywnosci). -->
        <fieldset class="filtr filtr-szeroki">
          <legend>Zakres dat</legend>
          <div id="presety-dat" class="presety"></div>
          <label class="zakres">od <input type="date" id="filtr-od" /></label>
          <label class="zakres">do <input type="date" id="filtr-do" /></label>
        </fieldset>

        <fieldset class="filtr filtr-szeroki">
          <legend>Nawyk</legend>
          <div id="filtr-nawyki" class="checkboxy"></div>
        </fieldset>

        <button type="button" id="przycisk-wyczysc">Wyczyść filtry</button>
      </div>
    </details>

    <!-- Podglad importu (dry-run) - ten sam mechanizm co na stronie zadan,
         rozni je tylko data-profil na przycisku wyzej. -->
    <section id="panel-importu" class="import" hidden>
      <h2 id="import-naglowek"></h2>
      <p id="import-uwagi" class="import-uwagi"></p>
      <div id="import-odrzucone"></div>
      <div class="import-akcje">
        <button type="button" id="przycisk-zatwierdz-import">Zatwierdź import</button>
        <button type="button" id="przycisk-anuluj-import">Anuluj</button>
      </div>
    </section>

    <!--
      Naglowki statyczne, wiersze buduje public/js/dziennik.js.
      data-kolumna = klucz sortowania; naglowek bez tego atrybutu jest nieklikalny.
      Domyslne sortowanie: data malejaco (najnowszy wpis u gory).
    -->
    <table id="tabela-dziennika">
      <thead id="naglowki" title="Kliknij nagłówek, aby posortować">
        <tr>
          <th class="kol-id" data-kolumna="id">#</th>
          <th class="kol-dzien" data-kolumna="data">Data</th>
          <th class="kol-godzina" data-kolumna="pobudka">Pobudka</th>
          <th class="kol-ocena" data-kolumna="godziny_snu">Sen (h)</th>
          <th class="kol-ocena" data-kolumna="jakosc_snu">Jakość snu</th>
          <th class="kol-ocena" data-kolumna="stres">Spokój</th>
          <th class="kol-ocena" data-kolumna="nastroj">Nastrój</th>
          <th class="kol-ocena" data-kolumna="intencjonalnosc">Intencjonalność</th>
          <th class="kol-tekst" data-kolumna="trzy_slowa">Trzy słowa</th>
          <th class="kol-tekst-szeroki" data-kolumna="nawyki">Nawyki</th>
          <th class="kol-tekst" data-kolumna="wdziecznosc">Wdzięczność</th>
          <th class="kol-tekst" data-kolumna="bledy">Błędy</th>
          <th class="kol-tekst" data-kolumna="rozmowa">Rozmowa</th>
          <th class="kol-tekst" data-kolumna="co_poszlo_dobrze">Co poszło dobrze</th>
          <th class="kol-tekst" data-kolumna="jutro_wazne">Jutro ważne</th>
          <th class="kol-tekst" data-kolumna="do_przemyslenia">Do przemyślenia</th>
          <!-- Licznik wypelnionych pol refleksyjnych. Tylko do odczytu - informacyjny,
               pokazuje ile z szesciu pol dzien ma opisanych. -->
          <th class="kol-refleksje" title="Ile z sześciu pól refleksyjnych jest wypełnionych">Refleksje</th>
          <th class="kol-tekst" data-kolumna="sniadanie">Śniadanie</th>
          <th class="kol-tekst" data-kolumna="obiad">Obiad</th>
          <th class="kol-tekst" data-kolumna="kolacja">Kolacja</th>
          <th class="kol-akcje"></th>
        </tr>
      </thead>
      <tbody id="wiersze"></tbody>
    </table>

    <!--
      Doladowanie listy. Tabela rysuje tylko pierwsze N wierszy tego, co przeszlo
      przez filtry - reszta czeka tutaj. To ograniczenie RYSOWANIA, nie filtr:
      eksport, kopia zapasowa i XP zawsze widza pelny zbior.
    -->
    <p id="doladowanie" class="doladowanie" hidden>
      <button type="button" id="przycisk-doladuj"></button>
    </p>

    <p id="podsumowanie" class="podsumowanie"></p>

    <!--
      Panel wyboru nawykow. Jeden na cala strone, pozycjonowany przy klikanej komorce.
      Trzymany poza tabela, zeby nie rozpychal wiersza i nie byl przycinany
      przez poziome przewijanie tabeli.
    -->
    <div id="panel-nawykow" class="panel-nawykow" hidden>
      <div class="panel-naglowek">
        <strong>Nawyki</strong>
        <button type="button" id="zamknij-nawyki" class="usun" title="Zamknij">×</button>
      </div>
      <div id="lista-nawykow" class="lista-nawykow"></div>
      <div class="panel-stopka">
        <input type="text" id="nowy-nawyk" placeholder="nazwa nowego nawyku" />
        <button type="button" id="dodaj-nawyk">+ Dodaj nawyk</button>
      </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/csv.js"></script>
    <script src="/js/filtr-dat.js"></script>
    <script src="/js/reguly-statystyk.js"></script>
    <script src="/js/reguly-dziennika.js"></script>
    <script src="/js/csv-import.js"></script>
    <script src="/js/dziennik.js"></script>
  </body>
</html>
