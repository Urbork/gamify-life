<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Character</title>
    <link rel="stylesheet" href="/css/style.css" />
    <!--
      Motyw ustawiany SYNCHRONICZNIE, przed pierwszym malowaniem - inaczej przy
      wyborze ciemnym mignelaby jasna strona. Stad zwykly <script> w <head>,
      bez defer i bez async.
    -->
    <script src="/js/motyw.js"></script>
  </head>
  <body>
    <header class="pasek">
      <h1>Character</h1>
      <!--
        Menu jest IDENTYCZNE na wszystkich stronach - ta sama kolejnosc, ten sam
        komplet pozycji. Wczesniej kazda strona miala wlasny podzbior (na "Postaci"
        brakowalo "Projektow"), wiec z menu nie dalo sie odczytac, co w ogole istnieje.

        Biezaca strone znaczy aria-current="page" - to jedyna roznica miedzy plikami.
        Atrybut niesie informacje takze dla czytnikow ekranu, a CSS wyroznia go wizualnie.

        Strzalki celowo usuniete: sugerowaly kolejnosc ("Dziennik -&gt;", "&lt;- Zadania"),
        ktorej miedzy tymi stronami nie ma.
      -->
      <nav class="nawigacja" aria-label="App sections">
        <a href="/index.html">📋 Tasks</a>
        <a href="/dziennik.html">📓 Journal</a>
        <a href="/statystyki.html">📊 Stats</a>
        <a href="/projekty.html">📁 Projects</a>
        <a href="/postac.html" aria-current="page">🎮 Character</a>
      </nav>
      <!-- Przelacznik motywu: system -> jasny -> ciemny. Tresc i tytul ustawia motyw.js. -->
      <button id="przelacznik-motywu" class="przelacznik-motywu" type="button"></button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </header>

    <!--
      Wszystko poza lista zakupow liczy sie NA ZYWO z zadan i wpisow dziennika.
      Nic nie jest zapisywane ani cache'owane, wiec poprawienie starego zadania
      od razu poprawia wynik. Cala historia wlicza sie sama, bez "aktywowania".
    -->
    <section id="wskaznik" class="wskaznik">
      <p class="brak-danych">Loading…</p>
    </section>

    <!--
      Atrybuty. Jedyna sekcja tej strony, ktora COS ZAPISUJE - reszta jest wylacznie
      odczytem z danych zrodlowych. Zawartosc buduje public/js/postac.js na podstawie
      listy z /api/slowniki, wiec dodanie atrybutu to wpis w config/atrybuty.js
      plus migracja, bez ruszania tego pliku.
    -->
    <h2>Attributes</h2>
    <section id="atrybuty" class="atrybuty">
      <p class="brak-danych">Loading…</p>
    </section>

    <h2>Where the XP came from</h2>
    <div id="rozbicie"></div>

    <h2>Spend gold</h2>
    <form id="formularz-zakupu" class="formularz-zakupu">
      <label>
        <span class="filtr-tytul">On what</span>
        <input type="text" id="nazwa-zakupu" placeholder="e.g. an evening with a series" required />
      </label>
      <label>
        <span class="filtr-tytul">Cost</span>
        <input type="number" id="koszt-zakupu" min="1" step="1" required />
      </label>
      <button type="submit">Spend</button>
    </form>

    <div id="lista-zakupow"></div>

    <script src="/js/api.js"></script>
    <script src="/js/postac.js"></script>
  </body>
</html>
